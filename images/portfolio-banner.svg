<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Portfolio banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="980" cy="130" r="140" fill="rgba(255,255,255,0.08)"/>
  <circle cx="160" cy="560" r="180" fill="rgba(34,211,238,0.10)"/>
  <rect x="90" y="120" width="420" height="420" rx="32" fill="rgba(15,23,42,0.35)" stroke="rgba(255,255,255,0.18)"/>

  <g transform="translate(140 180)">
    <rect x="0" y="0" width="260" height="260" rx="28" fill="url(#accent)" opacity="0.95"/>
    <circle cx="130" cy="100" r="62" fill="#f8fafc" opacity="0.9"/>
    <path d="M72 180 L130 120 L188 180" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M95 160 L130 120 L165 160" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#f8fafc" font-family="Arial, Helvetica, sans-serif">
    <text x="520" y="270" font-size="64" font-weight="700">My Portfolio</text>
    <text x="520" y="340" font-size="30" fill="#dbeafe">Web Developer</text>
    <rect x="520" y="380" width="250" height="10" rx="5" fill="#22d3ee"/>
    <text x="520" y="460" font-size="24" fill="#e2e8f0">Design • Build • Create</text>
  </g>
</svg>
